<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>End-screen preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Baloo+2:wght@600;700&display=swap"
    rel="stylesheet" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #26313A; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; }
    #game { position: relative; }
    #game canvas { display: block; border-radius: 14px; }
  </style>
</head>
<body>
  <div id="game"></div>
  <pre id="err" style="position:fixed;left:0;top:0;color:#f00;background:#fff;font:12px monospace;z-index:9999;margin:0;max-width:100vw;white-space:pre-wrap"></pre>
  <script>
    window.addEventListener('error', (e) => {
      document.getElementById('err').textContent +=
        '\nERR: ' + (e.message || e.error) + ' @ ' + (e.filename || '') + ':' + (e.lineno || '');
    });
    window.addEventListener('unhandledrejection', (e) => {
      document.getElementById('err').textContent += '\nREJECT: ' + (e.reason && (e.reason.stack || e.reason));
    });
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/webfont/1.6.28/webfontloader.js"></script>
  <script type="module">
    // Local dev harness: boots straight into ScoreEntryScene or LeaderboardScene
    // with mock data. ?scene=score (default) | board  ·  ?msg=... to preview a
    // chosen message on the leaderboard row.  NOT part of the shipped game.
    import { GAME } from './src/config.js';
    import { makeRuntimeTextures } from './src/util/textures.js';
    import PreloadScene from './src/scenes/PreloadScene.js';
    import ScoreEntryScene from './src/scenes/ScoreEntryScene.js';
    import LeaderboardScene from './src/scenes/LeaderboardScene.js';

    const params = new URLSearchParams(location.search);
    const which = params.get('scene') || 'score';
    const target = which === 'board' ? 'LeaderboardScene' : 'ScoreEntryScene';
    // ?js=Name:Score[:Message]  -> synthesise a `justSubmitted` for the board
    // (mimics a successful POST) to test the optimistic self-insert.
    const jsRaw = params.get('js');
    let justSubmitted = null;
    if (jsRaw && jsRaw.includes(':')) {
      const [n, s, ...rest] = jsRaw.split(':');
      justSubmitted = {
        name: n,
        score: Number(s),
        ts: Date.now(),
        message: rest.length ? rest.join(':') : null,
      };
    }
    const data =
      which === 'board'
        ? {
            score: Number(params.get('score') || 194),
            name: params.get('name') || 'EthanFan',
            message: params.get('msg') || null,
            saveError: params.get('saveError') === '1',
            justSubmitted,
          }
        : { score: Number(params.get('score') || 194) };

    class Boot extends Phaser.Scene {
      constructor() { super('Boot'); }
      create() {
        const go = () => this.scene.start('PreloadScene');
        if (window.WebFont) {
          window.WebFont.load({
            google: { families: ['Fredoka:500,600,700', 'Baloo 2:600,700'] },
            active: go,
            inactive: go,
          });
          this.time.delayedCall(3500, go);
        } else {
          go();
        }
      }
    }

    class Pre extends PreloadScene {
      create() {
        makeRuntimeTextures(this);
        this.scene.start(target, data);
      }
    }

    const game = new Phaser.Game({
      type: Phaser.AUTO,
      parent: 'game',
      width: GAME.WIDTH,
      height: GAME.HEIGHT,
      backgroundColor: '#BFE3EC',
      scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
      physics: { default: 'arcade', arcade: { gravity: { y: GAME.GRAVITY } } },
      dom: { createContainer: true },
      scene: [Boot, Pre, ScoreEntryScene, LeaderboardScene],
    });
    window.__game = game; // dev-harness hook for CDP screenshot scripts

    // For static screenshots: once the target scene is up, fast-forward every
    // tween (count-ups, row fade-ins) straight to the end so the capture shows
    // the settled layout rather than a random animation frame.
    // ?nosettle=1 disables this — needed to capture transient UI (e.g. toasts).
    if (params.get('nosettle') !== '1') {
      const pick = params.get('pick'); // preset message text to pre-select on ScoreEntry
      const openDd = params.get('open') === '1'; // leave the message dropdown open
      const settle = () => {
       try {
        const s = game.scene.getScene(target);
        if (s && s.sys && s.sys.isActive()) {
          const tws = (s.tweens.getTweens && s.tweens.getTweens()) || [];
          tws.forEach((t) => {
            try {
              t.seek(t.duration);
              t.update(0, 16);
            } catch (e) {}
          });
          if (pick && s.selectMessage && s.selectedMessage !== pick) {
            s.selectMessage(pick);
          }
          if (openDd && s.openDropdown && !s._ddOpen) s.openDropdown();
        }
       } catch (e) {}
      };
      setInterval(settle, 150);
    }
  </script>
</body>
</html>
