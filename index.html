<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Chicken Wing Fun</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Baloo+2:wght@600;700&display=swap"
    rel="stylesheet" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #26313A;
      overflow: hidden;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    * { -webkit-tap-highlight-color: transparent; }
    /* anchor for Phaser's DOM-element container (name-entry <input>) */
    #game { position: relative; }
    #game canvas {
      display: block;
      border-radius: 14px;
      box-shadow: 0 12px 44px rgba(0, 0, 0, 0.45);
    }
  </style>
</head>
<body>
  <div id="game"></div>

  <!-- Phaser 3 + WebFontLoader from CDN: no build step required. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/webfont/1.6.28/webfontloader.js"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
