<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Chicken Wing Fun</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Baloo+2:wght@600;700&display=swap"
    rel="stylesheet" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      /* 100vh is the layout viewport — on mobile it doesn't shrink/grow as the
         browser's address bar shows/hides, so it either leaves a gap (when the
         bar is showing, since 100vh already accounts for the bar-hidden height
         in some browsers) or lets the page grow taller than the visible area
         (in others), which is exactly what makes it scrollable. 100dvh tracks
         the actual visible viewport live, so the page is always exactly as
         tall as what's on screen — never more, never less. */
      height: 100vh; /* fallback for browsers without dvh support */
      background: #26313A;
      overflow: hidden; /* belt-and-suspenders: page must never scroll */
      overscroll-behavior: none; /* stop iOS/Android rubber-band bounce */
      touch-action: none; /* stop browser gesture handling from fighting the game's own drag-to-aim input */
    }
    @supports (height: 100dvh) {
      html, body {
        height: 100dvh;
      }
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    * { -webkit-tap-highlight-color: transparent; }
    /* anchor for Phaser's DOM-element container (name-entry <input>) */
    #game { position: relative; touch-action: none; }
    #game canvas {
      display: block;
      border-radius: 14px;
      box-shadow: 0 12px 44px rgba(0, 0, 0, 0.45);
      touch-action: none;
    }
  </style>
</head>
<body>
  <div id="game"></div>

  <!-- Phaser 3 + WebFontLoader from CDN: no build step required. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/webfont/1.6.28/webfontloader.js"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
